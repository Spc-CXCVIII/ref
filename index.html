<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi - Icon Greeting</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .greeting-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }
        
        .greeting-title {
            font-size: 3em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .icons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .icon-wrapper {
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .icon-wrapper:hover {
            transform: scale(1.1);
        }
        
        .icon-wrapper svg {
            width: 80px;
            height: 80px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .greeting-container {
                margin: 20px;
                padding: 30px;
            }
            
            .greeting-title {
                font-size: 2.5em;
            }
            
            .icon-wrapper svg {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
